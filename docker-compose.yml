services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-patentpulse}
      POSTGRES_USER: ${DB_USER:-patentpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-patentpulse_secure_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-patentpulse} -d ${DB_NAME:-patentpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py seed_data && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-patentpulse-dev-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-patentpulse}
      DB_USER: ${DB_USER:-patentpulse}
      DB_PASSWORD: ${DB_PASSWORD:-patentpulse_secure_password}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      PATENTSVIEW_API_KEY: ${PATENTSVIEW_API_KEY:-}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
